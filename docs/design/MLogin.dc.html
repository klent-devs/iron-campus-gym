<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IRON CAMPUS GYM app · Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#090A0C}
.l{display:block;font-size:14px;font-weight:600;color:#D4D4D8;margin-bottom:8px}
.in{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border-radius:16px;border:1px solid #292B30;background:#151619;color:#A1A1AA}
.in input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#FFFFFF;font:16px Inter,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #090A0C; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 72px 24px 32px; box-sizing: border-box">
<svg width="420" height="420" viewBox="0 0 48 48" aria-hidden="true" style="position: absolute; right: -170px; top: -120px; opacity: .08"><path d="M36.7 11.3A18 18 0 1 0 36.7 36.7" fill="none" stroke="#FF3D0A" stroke-width="7" stroke-linecap="round"/></svg>
<div style="display: flex; flex-direction: column; align-items: center; text-align: center; position: relative">
<div style="width: 84px; height: 84px; border-radius: 24px; background: #FF3D0A; display: flex; align-items: center; justify-content: center"><svg width="58" height="58" viewBox="0 0 48 48" aria-hidden="true"><path d="M36.7 11.3A18 18 0 1 0 36.7 36.7" fill="none" stroke="#090A0C" stroke-width="7" stroke-linecap="round"/><path d="M18 13h12M18 35h12M24 13v22" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/></svg></div>
<div style="font: 800 22px Poppins, sans-serif; letter-spacing: 0.04em; margin-top: 16px">IRON CAMPUS <span style="color: #FF6A3D">GYM</span></div>
<div style="font: 700 12px Poppins, sans-serif; letter-spacing: 0.2em; color: #A1A1AA; margin-top: 4px">STRONGER EVERY DAY.</div>
</div>
<form style="display: flex; flex-direction: column; gap: 18px; margin-top: 40px; position: relative">
<div><label class="l" for="mu">Email or Member ID</label><div class="in"><input id="mu" value="ICG-2025-0291" autocomplete="username"></div></div>
<div><label class="l" for="mp">Password</label><div class="in"><input id="mp" type="{{ptype}}" value="andrea2026" autocomplete="current-password"><button type="button" onClick="{{toggle}}" style="height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: #1D1F23; color: #D4D4D8; font: 600 14px Inter, sans-serif">{{label}}</button></div></div>
<a href="#" style="align-self: flex-end; font-size: 15px; font-weight: 600; color: #FF6A3D; text-decoration: none; padding: 6px 0">Forgot Password?</a>
<a href="MHome.dc.html" style="height: 58px; border-radius: 16px; background: #FF3D0A; color: #FFFFFF; font: 700 17px Poppins, sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">Login</a>
</form>
<div style="flex: 1"></div>
<p style="margin: 0; padding: 16px; border-radius: 16px; background: #151619; border: 1px solid #292B30; font-size: 14px; line-height: 1.5; color: #D4D4D8; text-align: center">No account yet? Your login is created at the front desk when you sign up. Ask a receptionist.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = !!(this.state && this.state.s);
    return { ptype: s ? 'text' : 'password', label: s ? 'Hide' : 'Show', toggle: () => this.setState({ s: !s }) };
  }
}
</script>
</body>
</html>
