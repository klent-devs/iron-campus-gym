<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IRON CAMPUS GYM app · Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#090A0C}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #090A0C; font-family: Inter, system-ui, sans-serif; color: #FFFFFF">
<div style="height: 756px; overflow-y: auto; padding: 48px 20px 24px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 4px; margin-left: -10px">
<a href="MHome.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
<h1 style="margin: 0; flex: 1; font: 700 24px Poppins, sans-serif">Notifications</h1>
<button onClick="{{readAll}}" style="height: 48px; padding: 0 4px; border: 0; background: transparent; color: #FF6A3D; font: 600 14px Inter, sans-serif; cursor: pointer">Mark all read</button>
</div>
<p style="margin: 0 0 14px; font-size: 14px; color: #A1A1AA">{{label}}</p>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{items}}" as="n" hint-placeholder-count="6"><button onClick="{{n.read}}" style="{{n.card}}">
<span style="{{n.iw}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"/></svg></span>
<span style="flex: 1; min-width: 0; text-align: left"><span style="display: flex; justify-content: space-between; gap: 8px"><b style="{{n.ts}}">{{n.title}}</b><span style="font-size: 12px; color: #A1A1AA; white-space: nowrap">{{n.time}}</span></span><span style="display: block; font-size: 14px; line-height: 1.45; color: #D4D4D8; margin-top: 4px">{{n.body}}</span></span>
<span style="{{n.dot}}"></span>
</button></sc-for>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0"><dc-import name="TabBar" active="home" hint-size="390px,88px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rd = (this.state && this.state.rd) || {};
    const I = { pay: 'M20 6 9 17l-5-5', clock: 'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z', in: 'M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3M10 16l4-4-4-4M14 12H4', info: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5M12 8v.5', x: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9 9l6 6M15 9l-6 6' };
    const N = [
      ['a', 'Payment received', '₱1,200 by GCash for your Monthly plan. Receipt TXN-2026-11-0391.', '10:31 AM', I.pay, '#3DD598', 1],
      ['b', 'Checked in', 'Welcome back! You checked in at 10:38 AM.', '10:38 AM', I.in, '#FF6A3D', 1],
      ['c', 'Gym hours on 30 Nov', 'Holiday: open 8:00 AM – 4:00 PM only.', 'Sat', I.info, '#D4D4D8', 0],
      ['d', 'Membership expires in 7 days', 'Your Monthly plan ends 08 Nov. Renew at the front desk.', '01 Nov', I.clock, '#F5B95A', 0],
      ['e', 'Membership expired', 'Your plan ended 08 Sep. Your QR code won’t work until you renew.', '09 Sep', I.x, '#F07070', 0]
    ];
    const unread = N.filter(n => n[6] && !rd[n[0]]).length;
    return {
      label: unread ? unread + ' new' : 'You’re all caught up',
      readAll: () => { const r = {}; N.forEach(n => r[n[0]] = 1); this.setState({ rd: r }); },
      items: N.map(n => { const un = n[6] && !rd[n[0]]; return { title: n[1], body: n[2], time: n[3], icon: n[4],
        read: () => this.setState({ rd: Object.assign({}, rd, { [n[0]]: 1 }) }),
        card: 'display:flex;gap:12px;align-items:flex-start;width:100%;padding:16px;border-radius:18px;cursor:pointer;font-family:inherit;color:inherit;border:1px solid ' + (un ? 'rgba(255,61,10,.45);background:#1A1513' : '#292B30;background:#151619'),
        iw: 'width:42px;height:42px;border-radius:12px;background:#1D1F23;display:inline-flex;align-items:center;justify-content:center;flex:none;color:' + n[5],
        ts: 'font-size:15px;font-weight:' + (un ? 700 : 600),
        dot: 'width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:' + (un ? '#FF3D0A' : 'transparent') }; })
    };
  }
}
</script>
</body>
</html>
