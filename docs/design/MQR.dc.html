<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IRON CAMPUS GYM app · My QR</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#090A0C}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #090A0C; font-family: Inter, system-ui, sans-serif; color: #FFFFFF">
<div style="height: 756px; overflow-y: auto; padding: 56px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center">
<h1 style="margin: 0; align-self: flex-start; font: 700 26px Poppins, sans-serif">My QR Code</h1>
<section style="margin-top: 18px; width: 100%; box-sizing: border-box; border-radius: 26px; background: #151619; border: 1px solid #292B30; padding: 22px; display: flex; flex-direction: column; align-items: center">
<div style="padding: 16px; border-radius: 20px; background: #FFFFFF; position: relative">
<svg width="240" height="240" viewBox="0 0 25 25" shape-rendering="crispEdges" role="img" aria-label="Personal check-in QR code"><path d="{{qr}}" fill="#090A0C" fill-rule="evenodd"/></svg>
<span style="position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 14px; background: #090A0C; border: 4px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true"><path d="M36.7 11.3A18 18 0 1 0 36.7 36.7" fill="none" stroke="#FF3D0A" stroke-width="7" stroke-linecap="round"/><path d="M18 13h12M18 35h12M24 13v22" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/></svg></span>
</div>
<h2 style="margin: 18px 0 0; font: 700 22px Poppins, sans-serif">Andrea Lim</h2>
<div style="font: 16px ui-monospace, Menlo, monospace; color: #D4D4D8; margin-top: 4px">ICG-2025-0291</div>
<span style="margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px; border-radius: 999px; background: rgba(36,180,126,.15); color: #3DD598; font-size: 14px; font-weight: 700"><i style="width: 7px; height: 7px; border-radius: 50%; background: #3DD598"></i>Active · until 08 Dec 2026</span>
</section>
<div style="margin-top: 14px; width: 100%; box-sizing: border-box; padding: 16px; border-radius: 18px; background: rgba(255,61,10,.08); border: 1px solid rgba(255,61,10,.35); display: flex; gap: 12px; align-items: flex-start">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF6A3D" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3M10 16l4-4-4-4M14 12H4"/></svg>
<p style="margin: 0; font-size: 15px; line-height: 1.5">Present your QR code to the receptionist when entering or leaving the gym.</p>
</div>
<p style="margin: 12px 4px 0; font-size: 13px; line-height: 1.5; color: #A1A1AA">Your code holds a secure ID only — no name, phone number or payment details. If your phone is lost, the gym can cancel this code and give you a new one.</p>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0"><dc-import name="TabBar" active="qr" hint-size="390px,88px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 291, d = '';
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const fin = (x, y) => { d += 'M' + x + ' ' + y + 'h7v7h-7zM' + (x + 1) + ' ' + (y + 1) + 'v5h5v-5zM' + (x + 2) + ' ' + (y + 2) + 'h3v3h-3z'; };
    fin(0, 0); fin(18, 0); fin(0, 18);
    for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
      const inF = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16), logo = x > 9 && x < 15 && y > 9 && y < 15;
      if (!inF && !logo && r() < 0.48) d += 'M' + x + ' ' + y + 'h1v1h-1z';
    }
    return { qr: d };
  }
}
</script>
</body>
</html>
