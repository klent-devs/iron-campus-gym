<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IRON CAMPUS GYM · Bottom navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="App" style="width: 390px; height: 88px; box-sizing: border-box; background: #0D0E10; border-top: 1px solid #1D1F23; display: flex; align-items: flex-start; justify-content: space-around; padding: 8px 4px 0; font-family: Inter, system-ui, sans-serif">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.current}}" style="{{t.style}}">
<span style="{{t.wrap}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg></span>
<span>{{t.label}}</span>
</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","membership","qr","attendance","profile"],"default":"home"},"$preview":{"width":390,"height":88}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const T = [
      ['home', 'Home', 'MHome.dc.html', 'M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9z'],
      ['membership', 'Membership', 'MMembership.dc.html', 'M3 6h18v12H3zM3 10h18M7 15h4'],
      ['qr', 'My QR', 'MQR.dc.html', 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM18 14h2M14 18v2'],
      ['attendance', 'Attendance', 'MAttendance.dc.html', 'M8 3v3M16 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM9 14l2 2 4-4'],
      ['profile', 'Profile', 'MProfile.dc.html', 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6']
    ];
    return {
      tabs: T.map(([id, label, href, icon]) => {
        const on = id === a, qr = id === 'qr';
        return { label, href, icon, current: on ? 'page' : 'false',
          style: 'flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;text-decoration:none;font-size:12px;font-weight:' + (on ? '700' : '500') + ';color:' + (on ? '#FF6A3D' : '#A1A1AA'),
          wrap: qr ? 'width:56px;height:56px;margin-top:-28px;border-radius:50%;background:#FF3D0A;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px #0D0E10' : 'width:46px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;' + (on ? 'background:rgba(255,61,10,.14)' : '') };
      })
    };
  }
}
</script>
</body>
</html>
