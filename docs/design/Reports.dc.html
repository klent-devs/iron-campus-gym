<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IRON CAMPUS GYM · Reports</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#090A0C;color:#FFFFFF;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box}
a{color:#FF6A3D;text-decoration:none}a:hover{color:#FF8A65}
h1,h2,h3{font-family:Poppins,Inter,sans-serif;margin:0;color:#FFFFFF}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;border:1px solid #292B30;background:#1D1F23;color:#FFFFFF;font:600 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.btn.pri{background:#FF3D0A;border-color:#FF3D0A;font-weight:700}
.l{display:block;font-size:14px;font-weight:600;color:#D4D4D8;margin-bottom:8px}
.in{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid #292B30;background:#0D0E10;color:#FFFFFF;font:15px Inter,sans-serif}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:#A1A1AA;font-size:13px;padding:14px 16px;background:#1D1F23;white-space:nowrap}
.tbl td{padding:12px 16px;border-top:1px solid #292B30;white-space:nowrap}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #090A0C">
<div style="flex: 1 1 260px; background: #0D0E10"><dc-import name="Sidebar" active="reports" hint-size="100%,960px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; padding: 16px 20px 40px; gap: 20px">
<dc-import name="Topbar" hint-size="100%,80px"></dc-import>
<div style="padding: 4px 4px 0"><h1 style="font-size: 26px; font-weight: 700">Reports</h1><p style="margin: 6px 0 0; font-size: 15px; color: #A1A1AA">Pick a report, choose the dates, then generate.</p></div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px" role="group" aria-label="Report type">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="5"><button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">
<span style="{{c.iconWrap}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"/></svg></span>
<b style="display: block; font: 600 16px Poppins, sans-serif; margin-top: 12px">{{c.name}}</b><span style="display: block; font-size: 13px; color: #A1A1AA; margin-top: 2px">{{c.desc}}</span>
</button></sc-for>
</div>

<section style="background: #151619; border: 1px solid #292B30; border-radius: 16px; padding: 18px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end">
<div style="flex: 1 1 160px"><label class="l" for="df">From</label><input class="in" id="df" value="01 Nov 2026"></div>
<div style="flex: 1 1 160px"><label class="l" for="dt">To</label><input class="in" id="dt" value="09 Nov 2026"></div>
<div style="flex: 2 1 240px"><label class="l" for="rq">Search</label><input class="in" id="rq" placeholder="Member, item or transaction no. (optional)"></div>
<button class="btn pri" style="height: 46px">Generate Report</button>
</section>

<section style="background: #151619; border: 1px solid #292B30; border-radius: 16px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 18px; border-bottom: 1px solid #292B30">
<div style="display: flex; gap: 12px; align-items: center">
<svg width="36" height="36" viewBox="0 0 48 48" aria-hidden="true"><path d="M36.7 11.3A18 18 0 1 0 36.7 36.7" fill="none" stroke="#FF3D0A" stroke-width="7" stroke-linecap="round"/><path d="M18 13h12M18 35h12M24 13v22" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/></svg>
<div><h2 style="font-size: 19px">{{r.name}}</h2><span style="font-size: 13px; color: #A1A1AA">IRON CAMPUS GYM · 01 – 09 Nov 2026 · generated by Marco Villanueva</span></div>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="btn">Print</button><button class="btn">Export Excel</button><button class="btn pri">Export PDF</button></div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; padding: 18px">
<sc-for list="{{r.sum}}" as="s" hint-placeholder-count="3"><div style="background: #1D1F23; border-radius: 12px; padding: 14px 16px"><div style="font-size: 13px; color: #A1A1AA">{{s.k}}</div><div style="{{s.vs}}">{{s.v}}</div></div></sc-for>
</div>
<div style="overflow-x: auto">
<table class="tbl"><thead><tr><sc-for list="{{r.cols}}" as="h" hint-placeholder-count="5"><th>{{h}}</th></sc-for></tr></thead>
<tbody><sc-for list="{{r.rows}}" as="row" hint-placeholder-count="5"><tr><sc-for list="{{row}}" as="cell" hint-placeholder-count="5"><td>{{cell}}</td></sc-for></tr></sc-for>
<tr style="background: #1D1F23"><sc-for list="{{r.total}}" as="cell" hint-placeholder-count="5"><td style="font-weight: 700">{{cell}}</td></sc-for></tr></tbody></table>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const k = (this.state && this.state.k) || 'pay';
    const big = c => 'font:700 24px Poppins,sans-serif;margin-top:4px;color:' + (c || '#FFFFFF');
    const R = {
      mem: { name: 'Membership Report', desc: 'New, renewed, expiring', icon: 'M3 6h18v12H3zM3 10h18M7 15h4', sum: [['New members', '28'], ['Renewals', '96', '#3DD598'], ['Expired, not renewed', '37', '#F07070']], cols: ['Plan', 'New', 'Renewed', 'Expired', 'Active now'], rows: [['Monthly', '17', '58', '22', '248'], ['Student Monthly', '8', '24', '11', '96'], ['Quarterly', '2', '11', '3', '51'], ['Annual', '1', '3', '1', '23']], total: ['Total', '28', '96', '37', '418'] },
      att: { name: 'Attendance Report', desc: 'Visits and time spent', icon: 'M8 3v3M16 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM9 14l2 2 4-4', sum: [['Total check-ins', '1,064'], ['Daily average', '118'], ['Average stay', '1h 34m', '#FF6A3D']], cols: ['Date', 'Check-ins', 'Busiest hour', 'Average stay', 'Missed check-outs'], rows: [['Mon 09 Nov', '124', '6–7 PM', '1h 31m', '0'], ['Sun 08 Nov', '96', '4–5 PM', '1h 40m', '2'], ['Sat 07 Nov', '131', '8–9 AM', '1h 38m', '0'], ['Fri 06 Nov', '119', '6–7 PM', '1h 29m', '1']], total: ['9 days', '1,064', '6–7 PM', '1h 34m', '5'] },
      walk: { name: 'Walk-in Report', desc: 'Day-pass visits and fees', icon: 'M13 4.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM9 21l3-7 3 3v4M7 11l3-4h4l2 3 3 1', sum: [['Walk-in visits', '207'], ['Collected', '₱18,940', '#3DD598'], ['Became members', '6', '#FF6A3D']], cols: ['Date', 'Regular (₱100)', 'Student (₱80)', 'Unpaid', 'Collected'], rows: [['Mon 09 Nov', '12', '5', '1', '₱1,520'], ['Sun 08 Nov', '19', '6', '0', '₱2,380'], ['Sat 07 Nov', '24', '9', '0', '₱3,120'], ['Fri 06 Nov', '15', '7', '0', '₱2,060']], total: ['9 days', '148', '59', '1', '₱18,940'] },
      pay: { name: 'Payment Report', desc: 'Money received by type', icon: 'M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7zm0 0 2-3h11v3M16 13.5h2', sum: [['Total collected', '₱486,300', '#3DD598'], ['Payments', '612'], ['Voided / refunded', '₱1,280', '#F07070']], cols: ['Payment Method', 'Memberships', 'Walk-ins', 'Products', 'Total'], rows: [['Cash', '₱241,500', '₱14,220', '₱9,860', '₱265,580'], ['GCash', '₱168,900', '₱4,720', '₱4,800', '₱178,420'], ['Bank Transfer', '₱42,300', '—', '—', '₱42,300']], total: ['Total', '₱452,700', '₱18,940', '₱14,660', '₱486,300'] },
      inv: { name: 'Inventory Report', desc: 'Stock levels and movement', icon: 'M21 8 12 3 3 8v8l9 5 9-5V8zM3 8l9 5 9-5M12 13v8', sum: [['Items', '38'], ['Stock value (cost)', '₱41,870'], ['Low / out of stock', '3 / 1', '#FF7A50']], cols: ['Category', 'Items', 'Stock in', 'Stock out', 'On hand'], rows: [['Drinks and Beverages', '9', '180', '214', '312'], ['Protein Products', '7', '60', '71', '148'], ['Gym Supplies', '10', '40', '18', '402'], ['Cleaning Materials', '8', '24', '30', '206'], ['Other Products', '4', '10', '6', '78']], total: ['Total', '38', '314', '339', '1,146'] }
    };
    const order = ['mem', 'att', 'walk', 'pay', 'inv'];
    const r = R[k];
    return {
      cards: order.map(id => { const on = id === k; return { name: R[id].name, desc: R[id].desc, icon: R[id].icon, pressed: on ? 'true' : 'false', pick: () => this.setState({ k: id }),
        style: 'text-align:left;padding:18px;border-radius:16px;cursor:pointer;color:#FFFFFF;font-family:inherit;background:#151619;border:' + (on ? '2px solid #FF3D0A' : '1px solid #292B30'),
        iconWrap: 'width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;' + (on ? 'background:#FF3D0A;color:#FFFFFF' : 'background:#1D1F23;color:#FF6A3D') }; }),
      r: { name: r.name, cols: r.cols, rows: r.rows, total: r.total, sum: r.sum.map(s => ({ k: s[0], v: s[1], vs: big(s[2]) })) }
    };
  }
}
</script>
</body>
</html>
